# .github/workflows/deploy-netlify.yml

name: Deploy to Netlify 🚀

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm ci

      - name: Build application 🛠️
        run: npm run build

      - name: Deploy to Netlify ☁️
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-branch: main
          deploy-message: "🚀 Deploy from GitHub Actions: ${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 3

# Required GitHub Secrets:
#   NETLIFY_AUTH_TOKEN — Netlify personal access token
#   NETLIFY_SITE_ID    — Netlify site API ID
# Supabase URL and anon key are currently inlined in src/lib/supabase.ts.
# If you move them to env vars, add VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
# as repo secrets and pass them under the build step's `env:` block.
